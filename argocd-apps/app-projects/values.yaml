# ---------------------------------------------------------------------------
# argocd-apps/app-projects/values.yaml
#
# The governance envelope.
#
#   ApplicationSet = fleet scheduler      WHICH Applications should exist
#   Application    = desired state        WHAT gets reconciled
#   AppProject     = governance envelope  WHERE FROM, WHERE TO, WHAT IS ALLOWED
#
# An ApplicationSet cannot escape its project. The generated Application carries
# spec.project, and ArgoCD evaluates every one against it. If a generator
# discovers a cluster the project does not permit, the Application is created
# and then refuses to sync -- it is not deployed just because the generator
# asked for it.
#
# ===========================================================================
# WHY THIS IS ITS OWN CHART -- A BUG FIX, NOT A TIDY-UP
#
# These projects previously lived in cluster-addons/argocd/templates/projects/.
# That is a bootstrap deadlock on a cluster that has never seen them:
#
#   the cluster-addons ApplicationSet generates an Application for the argocd
#   addon
#        -> that Application carries spec.project: cluster-addons
#        -> ArgoCD refuses to sync an Application whose project does not exist
#        -> the project was created BY that Application
#        -> nothing ever syncs
#
# ArgoCD reports "Application referencing project cluster-addons which does not
# exist" and stops. It cannot resolve on retry: the only thing that would create
# the project is the thing being blocked.
#
# It works on a cluster where the projects already exist from an earlier
# install, which is exactly why this class of bug survives to the first clean
# bootstrap -- and a KinD cluster is nothing but clean bootstraps.
#
# ===========================================================================
# BOOTSTRAP ORDER ON THE HUB
#
#   1. ArgoCD itself    (its CRDs must exist before an AppProject can apply)
#   2. THIS CHART       helm upgrade --install app-projects ./argocd-apps/app-projects -n argocd
#   3. app-sets         helm upgrade --install app-sets ./argocd-apps/app-sets -n argocd
#
# Step 2 before step 3 is not a preference. Reverse them and every generated
# Application sits in "project does not exist" until the projects appear.
#
# ===========================================================================
# WHY THERE ARE NO env/<env>/ OVERLAYS HERE
#
# Every chart under cluster-addons/ and cluster-apps/ carries env overlays,
# because those charts are deployed once per workload cluster. AppProjects are
# not: they are objects on the ARGO CD HUB, and the hub holds every
# environment's projects at once. One release owns them all.
#
# Per-environment policy therefore lives in the `environments` list below.
# Same principle -- common policy stated once, only real deltas per environment
# -- expressed in the shape the object model actually has.
# ---------------------------------------------------------------------------

# Namespace ArgoCD runs in on the hub. AppProject is namespaced, and ArgoCD only
# reads projects from its own namespace.
argocdNamespace: argocd

# ---------------------------------------------------------------------------
# Repositories any Application in these projects may pull from.
#
# MUST match app-sets/values.yaml repo.url. A mismatch does not fail loudly:
# Applications appear in the UI and then refuse to sync with
# "application repo ... is not permitted in project", which reads like a
# credentials problem and is not one.
#
# This is the single most valuable control in the CRD -- it stops an
# Application, even one generated by an ApplicationSet, from pulling manifests
# out of an arbitrary repository.
# ---------------------------------------------------------------------------
sourceRepos:
  - https://github.com/CHANGEME-ORG/*

# ---------------------------------------------------------------------------
# Environments and their destination API servers.
#
# MUST stay in step with app-sets/values.yaml clusters[]. hack/validate.py
# checks it -- a project whose destination does not match the ApplicationSet's
# generated destination rejects every Application for that cluster.
#
# `server` is matched literally by ArgoCD against the Application's
# destination.server, so these must be the exact strings ArgoCD registered the
# clusters under. For KinD spokes that is the container network address of the
# spoke's control-plane container, NOT localhost -- see README-setup-poc.md.
# ---------------------------------------------------------------------------
environments:
  - name: nonprod
    server: https://k8s.nonprod.example.internal
  - name: preprod
    server: https://k8s.preprod.example.internal
  - name: uat
    server: https://k8s.uat.example.internal
  - name: prod
    server: https://k8s.prod.example.internal

# ---------------------------------------------------------------------------
# PER-ENVIRONMENT PROJECTS
#
# true  -> cluster-addons-nonprod, cluster-addons-prod, ...
#          cluster-apps-nonprod,   cluster-apps-prod,   ...
#          each scoped to exactly ONE destination server.
#
# false -> one cluster-addons and one cluster-apps project spanning every
#          cluster. The previous behaviour, kept so the change is reversible
#          without editing templates.
#
# TRUE IS THE POINT. With per-environment projects an Application generated for
# nonprod physically cannot target prod: the project permits one server and
# ArgoCD rejects anything else. That is a blast-radius boundary enforced by the
# control plane rather than by the correctness of a generator.
#
# It is also the single best thing to demonstrate live. Point a cluster entry at
# the wrong server and watch ArgoCD refuse, instead of deploying nonprod's
# manifests into prod.
#
# The ApplicationSets read the same flag from app-sets/values.yaml
# (projects.perEnvironment). BOTH must agree or the generated Applications name
# projects that do not exist. hack/validate.py checks it.
# ---------------------------------------------------------------------------
perEnvironment: true

projects:
  # -------------------------------------------------------------------------
  # Platform add-on layer.
  #
  # Deliberately permissive on resource kinds: addons legitimately install CRDs,
  # ClusterRoles, webhooks and namespaces. cert-manager, Kyverno, Crossplane and
  # the ScyllaDB operator all need cluster scope, and a whitelist that fought
  # them would be edited away at the first failure -- which is worse than not
  # having one.
  #
  # The boundaries that ARE enforced here are source repository and destination
  # cluster, which are the two that actually contain a mistake.
  # -------------------------------------------------------------------------
  addons:
    name: cluster-addons
    description: Platform add-on layer. Managed by the cluster-addons ApplicationSet.
    # Addons own their own namespaces (namespace = addon directory name).
    destinationNamespaces:
      - '*'
    clusterResourceWhitelist:
      - group: '*'
        kind: '*'
    namespaceResourceWhitelist:
      - group: '*'
        kind: '*'
    clusterResourceBlacklist: []
    namespaceResourceBlacklist: []
    orphanedResources:
      warn: true

  # -------------------------------------------------------------------------
  # Workload layer. This is where the lockdown belongs.
  # -------------------------------------------------------------------------
  apps:
    name: cluster-apps
    description: Workload layer. Managed by the cluster-apps ApplicationSet.
    # Matches the <cluster>-<chart> namespace the cluster-apps ApplicationSet
    # produces. An app cannot target kube-system, argocd or any addon namespace,
    # because none of those has a hyphen in that position.
    destinationNamespaces:
      - '*-*'
    # EMPTY, and load-bearing. Nothing an app chart legitimately ships is
    # cluster-scoped: Gateway, HTTPRoute, Issuer, Certificate, ServiceMonitor,
    # ScyllaCluster and PodDisruptionBudget are all namespaced.
    clusterResourceWhitelist: []
    namespaceResourceWhitelist:
      - group: '*'
        kind: '*'
    clusterResourceBlacklist: []
    # Even inside its own namespace, an app team setting its own quota defeats
    # the platform's capacity model.
    namespaceResourceBlacklist:
      - group: ''
        kind: ResourceQuota
      - group: ''
        kind: LimitRange
    orphanedResources:
      warn: true

# ---------------------------------------------------------------------------
# Hub-side bootstrap project.
#
# For Applications whose destination is the ArgoCD hub itself rather than a
# workload cluster -- cluster-secrets, and an Application managing this chart
# once the project layer is self-hosting.
#
# Scoped to the in-cluster endpoint and the argocd namespace only. Nothing in
# this project can reach a workload cluster, which is the correct blast radius
# for something whose job is to create other Applications.
# ---------------------------------------------------------------------------
bootstrapProject:
  enabled: true
  name: platform-bootstrap
  description: Hub-side Applications that manage ArgoCD's own configuration.
  server: https://kubernetes.default.svc
  namespaces:
    - argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
    - group: ''
      kind: Secret

# ---------------------------------------------------------------------------
# Sync windows -- project-level deployment freezes.
#
# They apply to every Application in the project regardless of what the
# ApplicationSet does: it keeps generating, ArgoCD keeps refusing to sync.
#
# OFF by default. A freeze nobody agreed to is worse than none, because it
# presents as "GitOps is broken" at 02:00.
#
# Shape for a Friday-evening production freeze, with break-glass preserved:
#   prod:
#     enabled: true
#     windows:
#       - kind: deny
#         schedule: '0 20 * * 5'      # Fri 20:00
#         duration: 60h               # through Monday 08:00
#         applications: ['*']
#         manualSync: true
# ---------------------------------------------------------------------------
syncWindows:
  nonprod:
    enabled: false
    windows: []
  preprod:
    enabled: false
    windows: []
  uat:
    enabled: false
    windows: []
  prod:
    enabled: false
    windows: []

# ---------------------------------------------------------------------------
# Project roles -- scoped RBAC that does not require ArgoCD-wide permissions.
# A role's policies are evaluated only within its own project.
#
# OFF by default because the group names depend on the ArgoCD OIDC connector,
# and a policy referencing groups the connector does not emit silently matches
# nobody -- which looks like it is working.
# ---------------------------------------------------------------------------
roles:
  enabled: false
