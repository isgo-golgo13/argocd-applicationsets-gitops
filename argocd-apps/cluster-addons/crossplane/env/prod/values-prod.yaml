crossplane:
  replicaCount: 3
  resourcesCrossplane:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  # Provider installation moved to Provider CRs in templates/providers.yaml.
  # values-level provider.packages is the pre-1.15 path and the monolithic
  # cloud providers have since split into per-service families.
  metrics:
    enabled: true
  rbacManager:
    deploy: true
  webhooks:
    enabled: true