route:
  enabled: true
  host: goldilocks.prod.CHANGEME.example.com

goldilocks:
  controller:
    replicaCount: 2
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # Single dashboard key: the previous file declared `dashboard:` twice, and
  # YAML last-key-wins silently discarded the first block (which held the
  # Ingress config -- dead twice over, since it also pointed at an nginx
  # controller this repo never installs). Routing is templates/route.yaml.
  dashboard:
    replicaCount: 2
    service:
      type: ClusterIP
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
