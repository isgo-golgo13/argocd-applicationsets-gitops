apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-addons
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform add-on layer. Managed by the cluster-addons ApplicationSet.
  # Scoped to this GitOps repo. '*' would let any Application in this project
  # pull from an arbitrary repository, which defeats the RBAC boundary that is
  # one of the three reasons this pattern beats app-of-apps.
  sourceRepos:
{{- toYaml .Values.projects.sourceRepos | nindent 4 }}
  destinations:
    - namespace: '*'
      server: '*'
  # Addons legitimately install CRDs and cluster-scoped RBAC, so this stays open.
  # cluster-apps is the project that gets locked down.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
