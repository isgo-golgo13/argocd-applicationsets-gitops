apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Workload layer. Managed by the cluster-apps ApplicationSet.
  sourceRepos:
{{- toYaml .Values.projects.sourceRepos | nindent 4 }}
  # Matches the <cluster>-<chart> namespace produced by the cluster-apps
  # ApplicationSet template. An app cannot target a platform namespace.
  destinations:
    - namespace: '*-*'
      server: '*'
  # Deliberately empty. Application teams do not install CRDs, ClusterRoles or
  # ClusterIssuers. Namespaced Gateway API resources (Gateway, HTTPRoute) and
  # cert-manager Issuer/Certificate are covered by the namespaced whitelist
  # below -- nothing an app chart legitimately ships is cluster-scoped.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
