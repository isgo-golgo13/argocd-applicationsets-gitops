# ---------------------------------------------------------------------------
# app-sets/values.yaml
#
# Single source of truth for repository location, cluster topology, AppProject
# names and sync-wave ordering. Repointing this whole repo at another Git org
# is a one-line change here -- nothing under templates/ hardcodes a URL.
# ---------------------------------------------------------------------------

repo:
  # CHANGE ME at fork time. Must match the AppProject sourceRepos glob in
  # cluster-addons/argocd/values.yaml, or every generated Application will be
  # rejected by its project.
  url: https://github.com/CHANGEME-ORG/argocd-applicationsets-gitops
  revision: HEAD

# Paths are relative to the REPOSITORY ROOT, not to this chart.
paths:
  addons: argocd-apps/cluster-addons
  apps: argocd-apps/cluster-apps

# ---------------------------------------------------------------------------
# AppProject wiring.
#
# The projects themselves are rendered by ../app-projects/, installed on the hub
# BEFORE this chart. These are the base names; with perEnvironment true the
# generated Applications reference "<base>-<cluster>".
#
# perEnvironment MUST match app-projects/values.yaml perEnvironment. Disagree
# and every generated Application names a project that does not exist and sits
# unsyncable. hack/validate.py checks the two agree.
# ---------------------------------------------------------------------------
projects:
  perEnvironment: true
  addons: cluster-addons
  apps: cluster-apps
  # Hub-side project for Applications whose destination is ArgoCD itself
  # (cluster-secrets). Never per-environment -- there is only one hub.
  bootstrap: platform-bootstrap

# Target clusters. Each entry pairs a cluster with the env overlay file that
# lives inside every chart at env/<name>/<valuesFile>.
#
# Post-delivery refinement: once cluster-secrets/ is populated this list can be
# replaced by a cluster generator with label selectors (env: prod), at which
# point adding a cluster becomes a Secret rather than a repo edit.
clusters:
  - name: nonprod
    url: https://k8s.nonprod.example.internal
    valuesFile: values-nonprod.yaml

  - name: preprod
    url: https://k8s.preprod.example.internal
    valuesFile: values-preprod.yaml

  - name: uat
    url: https://k8s.uat.example.internal
    valuesFile: values-uat.yaml

  - name: prod
    url: https://k8s.prod.example.internal
    valuesFile: values-prod.yaml

# ---------------------------------------------------------------------------
# Sync-wave ordering for cluster-addons.
#
# CRD-providing addons must reconcile before anything that consumes their CRDs.
# Each group below becomes its own matrix generator scoped to those directories
# and stamped with that wave. Any addon directory NOT named here is picked up by
# the catch-all glob and lands in addonDefaultWave -- so dropping in a new addon
# still works with zero edits, it just sorts last.
# ---------------------------------------------------------------------------
addonWaves:
  # Wave -2: CRDs and the secret-delivery path first.
  - wave: "-2"
    dirs:
      - cert-manager
      - external-secrets
      - sealed-secrets

  # Wave -1: controllers owning CRDs consumed by workloads and by each other.
  # scylla-operator sits here specifically because cert-manager (wave -2) must
  # already be reconciled -- it issues the cert for the operator's webhook
  # server. This is the concrete case the wave mechanism exists to solve.
  - wave: "-1"
    dirs:
      - kyverno
      - crossplane
      - keda
      - scylla-operator

# external-dns, argocd, goldilocks, kargo, vault and anything added
# later land here via the catch-all glob -- none of them provide CRDs that
# another addon consumes, so none needs an explicit wave. external-dns is the
# worked example: it was added with no edit to this file.
addonDefaultWave: "0"

# ---------------------------------------------------------------------------
# Addons present in Git but NOT deployed.
#
# The directory stays; it is simply excluded from every generator. Reversible in
# one line, unlike deleting a chart, and it keeps the drop-in property intact
# for everything else.
#
# Two things this is for:
#   - a hub/spoke topology, where the `argocd` addon must NOT be pushed to the
#     spokes: ArgoCD lives on the hub only. Excluding it is how a spoke stays a
#     spoke.
#   - parking a heavy addon during a proof of concept without losing its chart.
# ---------------------------------------------------------------------------
addonExclude: []

# All cluster-apps land after every addon.
appWave: "10"

# ---------------------------------------------------------------------------
# Retry policy stamped onto every generated Application.
#
# Sync waves order Applications relative to EACH OTHER. They cannot order
# objects inside ONE Application -- a chart whose CRDs and CRs land in the same
# sync can still race, and so can a chart with several sibling Helm
# dependencies. Retry covers that gap.
#
# It matters most on a first bootstrap against a brand-new cluster, where
# nothing is warm and every CRD is being established for the first time.
# ---------------------------------------------------------------------------
retry:
  limit: 5
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 5m
