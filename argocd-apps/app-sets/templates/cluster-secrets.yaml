{{- $repo := .Values.repo -}}
# ---------------------------------------------------------------------------
# cluster-secrets Application
#
# The one corner of the repo that is a plain Application, not an
# ApplicationSet: there is exactly one instance and it runs only on the hub.
# It syncs argocd-apps/cluster-secrets/ into the argocd namespace, where the
# sealed-secrets controller unseals each SealedSecret into the real
# cluster-registration Secret (argocd.argoproj.io/secret-type: cluster) that
# the ApplicationSets' list-generator destinations resolve against.
#
# include: sealed-*.yaml -- ONLY sealed material is ever applied. The
# unencrypted cluster-registration.template.yaml sits in the same directory
# as documentation and is never picked up.
#
# Wave -3: registrations must exist before any addon or app targets a spoke.
# (The hub's own "in-cluster" destination is implicit and needs no Secret,
# which is what breaks the chicken-and-egg on first bootstrap -- see
# cluster-secrets/spec-README.md for the full ordering.)
#
# prune: true is deliberate and symmetric with cluster-apps: deleting a
# sealed-*.yaml from Git deregisters that spoke. Registration is a repo edit
# in both directions.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.projects.addons }}
  source:
    repoURL: {{ $repo.url }}
    targetRevision: {{ $repo.revision }}
    path: argocd-apps/cluster-secrets
    directory:
      include: "sealed-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
