{{/* Non-secret configuration. Credentials live in app-secrets.yaml. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dct.name" . }}-config
  labels: {{- include "dct.labels" . | nindent 4 }}
data:
  RUST_LOG: {{ .Values.api.logLevel | quote }}
  SERVER_ADDR: {{ printf "0.0.0.0:%v" .Values.api.port | quote }}
  SCYLLA_HOSTS: {{ include "dct.scyllaHosts" . | quote }}
  SCYLLA_KEYSPACE: {{ .Values.scylla.keyspace | quote }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  ENABLE_PLAYGROUND: {{ .Values.api.enablePlayground | quote }}
  ENABLE_INTROSPECTION: {{ .Values.api.enableIntrospection | quote }}
