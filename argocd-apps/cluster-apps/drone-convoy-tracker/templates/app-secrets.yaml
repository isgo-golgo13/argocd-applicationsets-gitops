{{/*
Credentials via External Secrets Operator reading Vault, plus the cert-manager
Certificate backing the Gateway listener.

Nothing secret is templated into this repository -- only references to where
the values live. ESO and cert-manager are both cluster-addons at sync wave -2,
so their CRDs exist before this Application reconciles.
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "dct.name" . }}-secrets
  labels: {{- include "dct.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "dct.name" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: SCYLLA_USERNAME
      remoteRef:
        key: {{ .Values.externalSecrets.remotePath }}
        property: scylla_username
    - secretKey: SCYLLA_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remotePath }}
        property: scylla_password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remotePath }}
        property: redis_password
{{- end }}
{{- if .Values.certificate.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "dct.name" . }}-tls
  labels: {{- include "dct.labels" . | nindent 4 }}
spec:
  secretName: {{ include "dct.name" . }}-tls
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  # Issuer is a value, never hardcoded to a public ACME CA -- an internal
  # platform CA is the norm for this class of deployment.
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
  dnsNames:
    - {{ .Values.hostname | quote }}
{{- end }}
