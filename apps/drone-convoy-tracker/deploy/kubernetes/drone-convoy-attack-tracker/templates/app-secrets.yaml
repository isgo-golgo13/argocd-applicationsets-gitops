# ---------------------------------------------------------------------------
# app-secrets.yaml -- what the app needs kept secret, delivered by ESO.
# The chart declares the KEYS; the ClusterSecretStore decides the backend.
# Nothing sensitive is ever rendered here.
# ---------------------------------------------------------------------------
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "drone.fullname" . }}-secrets
  labels:
    {{- include "drone.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "drone.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: SCYLLA_USERNAME
      remoteRef: { key: {{ .Values.externalSecrets.remotePath }}, property: scylla_username }
    - secretKey: SCYLLA_PASSWORD
      remoteRef: { key: {{ .Values.externalSecrets.remotePath }}, property: scylla_password }
{{- end }}
{{- if .Values.certificate.enabled }}
---
# TLS for the Gateway https listener. Issued into the Gateway's namespace
# because that is where the listener's certificateRefs resolves.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "drone.tls.secret" . }}
  namespace: {{ include "drone.gateway.namespace" . }}
  labels:
    {{- include "drone.labels" . | nindent 4 }}
spec:
  secretName: {{ include "drone.tls.secret" . }}
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  dnsNames:
    - {{ .Values.hostname | quote }}
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
{{- end }}
