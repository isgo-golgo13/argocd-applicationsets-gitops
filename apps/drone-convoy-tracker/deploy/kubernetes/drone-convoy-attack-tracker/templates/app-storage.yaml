# ---------------------------------------------------------------------------
# app-storage.yaml -- state: ScyllaDB (via scylla-operator CR) and Redis.
# ---------------------------------------------------------------------------
{{- if .Values.scylla.create }}
apiVersion: scylla.scylladb.com/v1
kind: ScyllaCluster
metadata:
  name: {{ include "drone.fullname" . }}-scylla
  labels:
    {{- include "drone.labels" . | nindent 4 }}
spec:
  version: {{ .Values.scylla.version | quote }}
  agentVersion: {{ .Values.scylla.agentVersion | quote }}
  developerMode: {{ .Values.scylla.developerMode }}
  datacenter:
    name: {{ .Values.scylla.datacenter }}
    racks:
      - name: {{ .Values.scylla.rack }}
        members: {{ .Values.scylla.members }}
        storage:
          capacity: {{ .Values.scylla.storageCapacity }}
          {{- with .Values.scylla.storageClassName }}
          storageClassName: {{ . }}
          {{- end }}
        resources:
          requests: { cpu: {{ .Values.scylla.cpu | quote }}, memory: {{ .Values.scylla.memory }} }
          limits:   { cpu: {{ .Values.scylla.cpu | quote }}, memory: {{ .Values.scylla.memory }} }
---
# Schema init: apply the repo's CQL files once the cluster is up. Helm hook,
# runs after install/upgrade, tolerant of already-applied DDL (IF NOT EXISTS
# throughout; the 002 ALTER is || true, same as the Makefile).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drone.fullname" . }}-schema
  labels:
    {{- include "drone.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
{{ (.Files.Glob "schema/cql/*.cql").AsConfig | indent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "drone.fullname" . }}-schema-init
  labels:
    {{- include "drone.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cqlsh
          image: docker.io/scylladb/scylla:{{ .Values.scylla.version }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              H={{ include "drone.fullname" . }}-scylla-client.{{ .Release.Namespace }}.svc
              until cqlsh "$H" -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1; do echo waiting for scylla; sleep 5; done
              cqlsh "$H" -f /schema/000_keyspace_{{ ternary "prod" "dev" (eq .Values.scylla.developerMode false) }}.cql
              cqlsh "$H" -f /schema/001_core_schema.cql
              cqlsh "$H" -f /schema/002_waypoint_columns.cql || true
              echo schema applied
          volumeMounts:
            - { name: schema, mountPath: /schema }
      volumes:
        - name: schema
          configMap: { name: {{ include "drone.fullname" . }}-schema }
{{- end }}
{{- if .Values.redis.create }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drone.fullname" . }}-redis
  labels:
    {{- include "drone.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "drone.name" . }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "drone.name" . }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "drone.fullname" . }}-redis
  labels:
    {{- include "drone.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "drone.name" . }}
    app.kubernetes.io/component: redis
  ports: [{ name: redis, port: 6379, targetPort: redis }]
{{- end }}
