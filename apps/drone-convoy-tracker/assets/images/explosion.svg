<?xml version="1.0" encoding="UTF-8"?>
<!--
  explosion.svg : one-shot engagement burst, ~1.4s, then gone.

  Self-animating via SMIL, so dropping it into a Leaflet divIcon plays it with
  no JS driving frames. Every animation uses fill="freeze" and ends at zero
  opacity, so the marker can simply be removed after ~1.5s.

  Palette follows the blast-* custom properties; defaults are red through amber.
  For a MISS, set blast-core to a cold grey and the same asset reads as a
  dud without needing a second file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80"
     role="img" aria-label="Munition impact">

  <style>
    .bl-str-core { stroke: var(--blast-core, #ff2d2d); }
    .bl-str-mid  { stroke: var(--blast-mid,  #ffae2b); }
  </style>

  <defs>
    <radialGradient id="bl-core">
      <stop offset="0%"   stop-color="#fff3d6"/>
      <stop offset="35%"  stop-color="#ffae2b"/>
      <stop offset="70%"  stop-color="#ff2d2d"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- shockwave ring -->
  <circle cx="40" cy="40" r="4" fill="none"
          class="bl-str-core" stroke="#ff2d2d" stroke-width="3">
    <animate attributeName="r" from="4" to="36" dur="1.1s" fill="freeze"
             calcMode="spline" keySplines="0.1 0.8 0.2 1" keyTimes="0;1"/>
    <animate attributeName="stroke-width" from="3.5" to="0.2" dur="1.1s" fill="freeze"/>
    <animate attributeName="opacity" from="0.9" to="0" dur="1.1s" fill="freeze"/>
  </circle>

  <!-- second, faster ring for depth -->
  <circle cx="40" cy="40" r="2" fill="none"
          class="bl-str-mid" stroke="#ffae2b" stroke-width="2">
    <animate attributeName="r" from="2" to="22" dur="0.65s" fill="freeze"
             calcMode="spline" keySplines="0.05 0.9 0.2 1" keyTimes="0;1"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.65s" fill="freeze"/>
  </circle>

  <!-- fireball core -->
  <circle cx="40" cy="40" r="10" fill="url(#bl-core)">
    <animate attributeName="r" values="3;14;9;0" dur="0.9s" fill="freeze"
             keyTimes="0;0.25;0.5;1"/>
    <animate attributeName="opacity" values="1;1;0.8;0" dur="0.9s" fill="freeze"
             keyTimes="0;0.25;0.5;1"/>
  </circle>

  <!-- debris shards, eight radials -->
  <g class="bl-str-mid" stroke="#ffae2b" stroke-width="1.8" stroke-linecap="round">
    <g>
      <path d="M40 40 L40 22"/><path d="M40 40 L58 40"/>
      <path d="M40 40 L40 58"/><path d="M40 40 L22 40"/>
      <animateTransform attributeName="transform" type="scale"
                        values="0.15;1.15;1.3" dur="0.8s" additive="sum" fill="freeze"/>
      <animate attributeName="opacity" values="0.95;0.5;0" dur="0.8s" fill="freeze"/>
    </g>
    <g opacity="0.75">
      <path d="M40 40 L53 27"/><path d="M40 40 L53 53"/>
      <path d="M40 40 L27 53"/><path d="M40 40 L27 27"/>
      <animateTransform attributeName="transform" type="scale"
                        values="0.1;0.9;1.05" dur="0.95s" additive="sum" fill="freeze"/>
      <animate attributeName="opacity" values="0.75;0.35;0" dur="0.95s" fill="freeze"/>
    </g>
  </g>

  <!-- lingering smoke -->
  <circle cx="40" cy="40" r="0" fill="#1b1b1b">
    <animate attributeName="r" values="0;9;16" dur="1.4s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="1.4s" fill="freeze"/>
  </circle>
</svg>
