[workspace]
resolver = "2"
members = [
    "crates/drone-domain",
    "crates/drone-persistence",
    "crates/drone-graphql-api",
    "crates/drone-analytics",
    "crates/drone-frontend",
    "crates/drone-simulator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Tomas Wallick"]
license = "MIT"
repository = "https://github.com/isgo-golgo13/drone-convoy-attack-tracker-leptos-rs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# ScyllaDB driver
scylla = { version = "0.15", features = ["ssl"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# GraphQL
async-graphql = { version = "7.0", features = ["uuid", "chrono", "dataloader"] }
async-graphql-axum = "7.0"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Analytics (Step 4)
duckdb = { version = "1.1" }
arrow = "53"
parquet = "53"

# Frontend (Leptos)
leptos = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7", features = ["csr"] }
leptos_meta = { version = "0.7", features = ["csr"] }

# Geo
geo = "0.29"

# Testing
tokio-test = "0.4"
fake = { version = "3.0", features = ["chrono", "uuid"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

# ---------------------------------------------------------------------------
# Release profile.
#
# These settings MUST live here and not in RUSTFLAGS. Cargo compiles build
# scripts and proc-macros for the host with `-C embed-bitcode=no`, and forcing
# `-C lto` globally through RUSTFLAGS contradicts that -- rustc then rejects
# the combination and every proc-macro dependency fails to compile.
# Declared as a profile, Cargo applies LTO only where it is valid.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# The WASM bundle optimises for size, not speed. Per-package overrides may set
# opt-level and codegen-units; `lto` and `panic` are workspace-wide only, which
# is why the frontend crate no longer carries its own [profile.release].
[profile.release.package.drone-frontend]
opt-level = "z"
